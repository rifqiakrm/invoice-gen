<!DOCTYPE html>
<html>
<head>
    <title>Invoice PT. Krishand Style</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📋 Invoice Generator</h1>

        <!-- Company Info -->
        <div class="section">
            <h2>Informasi Perusahaan Pengirim</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Nama Perusahaan</label>
                    <input type="text" id="companyName" value="CV RIEKI SENROKU CREATIVE">
                </div>
                <div class="form-group">
                    <label>Alamat</label>
                    <input type="text" id="companyAddress" value="Jakarta Selatan - Indonesia">
                </div>
            </div>
        </div>

        <!-- Client Info -->
        <div class="section">
            <h2>Informasi Perusahaan Penerima</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Kepada Yth.</label>
                    <input type="text" id="clientName" value="PT ISM BOGASARI FLOUR JAKARTA">
                </div>
                <div class="form-group">
                    <label>Alamat Klien</label>
                    <input type="text" id="clientAddress" value="Jl. Raya Clinchip, Tanjung Priok">
                </div>
                <div class="form-group">
                    <label>Kota</label>
                    <input type="text" id="clientCity" value="Jakarta Utara - 14110">
                </div>
            </div>
        </div>

        <!-- Invoice Details -->
        <div class="section">
            <h2>Detail Invoice</h2>
            <div class="form-row">
                <div class="form-group" style="position: relative;">
                    <label>No. Invoice
                        <button type="button" onclick="generateInvoiceNumber()"
                                style="margin-left: 10px; padding: 4px 8px; font-size: 12px; background: #2ecc71;">
                            🔄 Generate
                        </button>
                    </label>
                    <input type="text" id="invoiceNumber" placeholder="Klik Generate untuk buat nomor">
                </div>
                <div class="form-group">
                    <label>Tanggal Invoice</label>
                    <input type="date" id="invoiceDate">
                    <small style="color: #666; margin-top: 5px; display: block;">
                        Default: hari ini
                    </small>
                </div>
            </div>
        </div>

        <!-- Bank Info -->
        <div class="section">
            <h2>Informasi Pembayaran</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Nama Bank</label>
                    <input type="text" id="bankName" value="">
                </div>
                <div class="form-group">
                    <label>No. Rekening</label>
                    <input type="text" id="accountNumber" value="">
                </div>
                <div class="form-group">
                    <label>Atas Nama</label>
                    <input type="text" id="accountName" value="">
                </div>
            </div>
        </div>

        <!-- Items Section dengan Dropdown SOW -->
        <div class="section">
            <h2>Daftar Barang/Jasa <button type="button" onclick="addItem()">+ Tambah Barang</button></h2>
            <div id="itemsContainer">
                <div class="item-row">
                    <!-- Dropdown SOW akan diisi oleh JavaScript -->
                    <select class="item-sow-dropdown" onchange="selectSOW(this)">
                        <option value="">Pilih Scope of Work</option>
                        <!-- Options akan ditambah oleh JS -->
                    </select>

                    <input type="text" placeholder="Custom Scope of Work" class="item-name" style="display: none;">

                    <input type="text" placeholder="Description" class="item-description" value="">

                    <input type="number" placeholder="QTY" class="item-qty" value="1" min="1" onchange="previewInvoice()">

                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="number" placeholder="Harga Satuan" class="item-price" value="0" style="flex: 1;" onchange="previewInvoice()">
                        <input type="number" placeholder="Gross Up %" class="item-grossup" value="0" min="0" max="1000"
                               style="width: 80px;" title="Persentase kenaikan harga" onchange="previewInvoice()">
                    </div>

                    <button type="button" onclick="removeItem(this)" class="remove-btn">×</button>
                </div>
            </div>
        </div>

        <!-- Gross Up Calculator (optional) -->
        <div class="section" style="background: #f8f9fa; padding: 15px;">
            <h3>📊 Gross Up Calculator</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label>Harga Dasar</label>
                    <input type="number" id="basePrice" placeholder="Harga dasar" value="1000000">
                </div>
                <div>
                    <label>Gross Up (%)</label>
                    <input type="number" id="grossUpPercent" placeholder="Persentase" value="10" min="0" max="1000">
                </div>
                <div>
                    <label>Hasil Gross Up</label>
                    <input type="text" id="grossUpResult" readonly style="background: #e9ecef;">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button onclick="calculateGrossUp()" style="padding: 10px 15px;">Hitung</button>
                </div>
            </div>
        </div>

        <!-- Additional Info -->
        <div class="section">
            <h2>Informasi Tambahan</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Diskon (%) <small>(isi 0 untuk hide)</small></label>
                    <input type="number" id="discountPercent" value="0" min="0" max="100">
                </div>
                <div class="form-group">
                    <label>PPH 23 (%) <small>(isi 0 untuk hide)</small></label>
                    <input type="number" id="taxPercent" value="0" min="0" max="100">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Nama Penanda Tangan</label>
                    <input type="text" id="signatoryName" value="Sherly Fanny Heriyanti">
                </div>
                <div class="form-group">
                    <label>Jabatan</label>
                    <input type="text" id="signatoryTitle" value="CEO">
                </div>
            </div>

            <!-- SIGNATURE UPLOAD SECTION -->
            <div class="form-row">
                <div class="form-group">
                    <label>Upload Tanda Tangan (Opsional)</label>
                    <input type="file" id="signatureUpload" accept="image/*">
                    <small style="display: block; margin-top: 5px; color: #666;">
                        Format: JPG, PNG. Ukuran disarankan: 500x200px
                    </small>
                    <div id="signaturePreview" style="margin-top: 15px; display: none; text-align: center;">
                        <div style="margin-bottom: 10px; font-weight: bold;">Preview Tanda Tangan:</div>
                        <img id="signatureImage" class="signature-image">
                        <br>
                        <button type="button" onclick="removeSignature()" class="remove-signature-btn">Hapus Tanda Tangan</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button onclick="previewInvoice()">👁️ Preview Invoice</button>
            <button onclick="generatePDF()" class="generate-btn">📥 Download PDF</button>
        </div>

        <!-- Invoice Preview -->
        <div id="invoicePreview" class="invoice-preview">
            <!-- PDF content will be generated here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
